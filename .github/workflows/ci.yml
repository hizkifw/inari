name: ci

on:
  push:
    branches: ['**']
    # A version tag is a release: the release job below publishes it.
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make test-race

  # Runs the installers against the latest published release, so a change
  # that breaks them fails here rather than for the next person installing.
  install:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - env:
          INARI_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh scripts/install.sh
          "$INARI_INSTALL_DIR/inari" --version | grep -E '^inari v[0-9]+\.[0-9]+\.[0-9]+$'

  install-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Windows PowerShell 5.1, which `iwr | iex` usually runs under, is the
      # one with the encoding and escape quirks the script works around.
      - shell: powershell
        env:
          INARI_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $out = & "$env:INARI_INSTALL_DIR\inari.exe" --version
          if ($out -notmatch '^inari v\d+\.\d+\.\d+$') { throw "unexpected version output: $out" }

  # Builds each release archive the way scripts/release.sh does, so every
  # push checks that each target builds. On a version tag the archives carry
  # the tag's version and are what the release publishes, so it never builds
  # them again.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          version=v0.0.0-ci
          case "$GITHUB_REF" in
            refs/tags/*) version=$GITHUB_REF_NAME ;;
          esac
          ./scripts/release.sh "$version" "${{ matrix.goos }}/${{ matrix.goarch }}"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: inari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/inari_*
          if-no-files-found: error
          # The archive is compressed already, and only the release job below
          # reads it.
          compression-level: 0
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # checkout fetches only the tagged commit, so re-fetch the annotated tag
      # object; --notes-from-tag reads the release notes from its message.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: inari-*
          path: dist
          merge-multiple: true
      - run: ./scripts/checksums.sh dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag
